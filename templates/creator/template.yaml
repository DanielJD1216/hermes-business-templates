# Creator + Education template. The installer reads this file.
# v0.2 mirrors the setup it was built from: one lead per department, each bot its own Slack app.
# v0.3: leads hand work to each other by mention (peers), and hbt check finds drift between the bots.
name: creator
title: Creator + Education
version: 0.3.1
workspace_dir: creator
system_channel: agents-report

roles:
  - key: creative-director
    title: Creative Director
    kind: role
    section: 20 Media and 30 Marketing
    # First channel is the bot's home. The bot answers in all of them without an @mention.
    channels: [media-video, media-edit, media-newsletter, marketing-distribution, offers-optimization]
    folder: media
    peers: [cto]          # hands build work to CTO by mention, and takes content work from it
    takes_cards: true     # Ops hands it cards (comment and member-question digests)
    reads: [canon, ops/incoming, desks]
    dirs: [video/episodes/active, video/episodes/archived, editing/active, editing/archived,
           editing/experiments, editing/maintained, newsletter/issues, distribution/packs,
           community/answers, community/posts, community/lessons, partnerships/inquiries,
           partnerships/invoices]
    starter_files:
      video/topic-queue.md: "# Topic queue\n\nUpdated: never\n"
      distribution/results-log.md: "# Results log\n\n| Post | Platform | Published | 48h | 7d | What worked |\n|---|---|---|---|---|---|\n"
      partnerships/deals.md: "# Deals\n\n| Sponsor | Terms | Deliverables | Due | Disclosure | Invoice | Next date |\n|---|---|---|---|---|---|---|\n"
    checks:
      - Every active episode folder has a status.md with a Stage line and a Next action line.
      - No on-screen number lacks a source.
      - Every script.md in an active episode starts with a runtime estimate.
      - The topic queue was updated in the last 35 days.
      - No edit has waited on the owner for more than 48 hours.
      - Open edit review notes are counted.
      - No editor handoff has missing files.
      - No newsletter draft is older than 7 days.
      - Every approved newsletter issue is scheduled.
      - Nothing approved for distribution is still unscheduled.
      - No scheduled item has failed.
      - The number of posts without an approval record is zero.
      - No member question has gone unanswered for more than 24 hours.
      - No community draft has waited on the owner for more than 48 hours.
      - No sponsor inquiry has waited more than 48 hours without a response.
      - Sponsor deliverables due in the next 7 days are listed.
      - Overdue invoices are listed.

  - key: cto
    title: CTO
    kind: role
    section: 50 Build
    channels: [build-architect]
    folder: build
    reads: [canon]
    dirs: [plans]
    peers: [engineer, creative-director]  # bots it may @mention and hear from
    slack_toolsets: [kanban]  # added to the bot's Slack tools, so it can create cards
    checks:
      - No card assigned to engineer has been blocked for more than 24 hours.

  - key: engineer
    title: Engineer
    kind: role
    section: 50 Build
    channels: [build-engineering]
    folder: engineering
    reads: [canon, build/plans]
    dirs: [notes]
    peers: [cto]
    takes_cards: true     # runs cards in the background, so memory saves cannot wait for approval
    builds: true          # works in the projects folder; setup's first card goes to it

  - key: ops
    title: Ops
    kind: ops
    channels: [agents-report]
    folder: ops
    reads: [all]
    dirs: [incoming, reviews]

desks:
  # A desk answers one person outside the business (Q20). Add one per editor with
  # `hbt desk creator desk-editor --name <editor>`, only where rootless Docker runs (Q26).
  # Each editor gets their own Slack app, channel ext-editor-<name> and folder desks/editor-<name>,
  # file tools only, no network, and sees only their own folder.
  - key: desk-editor
    title: Editor desk
    kind: desk
    channels: [ext-editor]
    folder: desks/editor
    dirs: [handoff]
    starter_files:
      brief.md: |
        # Editor brief

        The Editor desk answers this editor from this file only. Write here
        only what the editor may see. Keep scripts, money and private notes out.

        ## Current project
        - Title:
        - Due:
        - Length:
        - Style notes:
        - Music and fonts:
        - Where to upload:

        ## Always true
        - Export settings:
        - Captions:

jobs:
  - key: memory-watchdog
    schedule: "*/5 * * * *"
    script: hbt_memory_watch.py
    no_agent: true
    requires: openviking
  - key: morning-approvals
    schedule: "30 7 * * *"
    skill: creator-ops-morning-list
    prompt: "Run the creator-ops-morning-list playbook and reply with the list."
  - key: nightly-review
    schedule: "0 21 * * *"
    skill: creator-ops-nightly-review
    prompt: "Run the creator-ops-nightly-review playbook and reply with the result."
  - key: update-check
    schedule: "0 9 * * 1"
    script: hbt_update_check.py
    no_agent: true
  - key: drift-check      # hbt check: posts only when the gaps change, and weekly while they stay open
    schedule: "0 8 * * *"
    script: hbt_drift_check.py
    no_agent: true
  - key: comment-pull
    schedule: "0 9 1 * *"
    skill: creator-ops-comment-pull
    prompt: "Run the creator-ops-comment-pull playbook."
    paused_reason: "Needs a comment export. Resume once you drop exports into ops/incoming/comments/."
  - key: member-questions
    schedule: "0 9 * * 1"
    skill: creator-ops-member-questions
    prompt: "Run the creator-ops-member-questions playbook."
    paused_reason: "Needs a member-question export. Resume once you drop exports into ops/incoming/questions/."
